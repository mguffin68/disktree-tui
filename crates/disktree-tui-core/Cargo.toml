[package]
name = "disktree-tui-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
walkdir = "2.5"
tokio = { version = "1", features = ["fs", "io-util", "signal", "sync", "rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cfg-if = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

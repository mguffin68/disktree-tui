[package]
name = "disktree-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal disk usage explorer and cleanup tool"
license = "MIT"

[dependencies]
disktree-tui-core = { path = "../disktree-tui-core" }
clap = { version = "4", features = ["derive"] }
ratatui = "0.30.2"
tokio = { version = "1.53.2", default-features = false, features = ["sync"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
